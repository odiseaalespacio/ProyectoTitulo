spring.application.name=cloty-api
server.port=8080
# Escuchar en todas las interfaces (celular/tablet en la misma red Wi‑Fi)
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/cloty?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crea/actualiza tablas desde las entidades JPA al arrancar (desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (HS256). En producción usar un secreto largo y variable de entorno.
cloty.jwt.secret=ClotyDevSecretKey_ChangeInProd_Min32CharsForHS256!!
cloty.jwt.expiration-ms=86400000

# Correo: desactivado por defecto. En local use application-local.properties (ver .example).
spring.config.import=optional:classpath:application-local.properties
cloty.mail.enabled=false
cloty.mail.from=noreply@cloty.local
cloty.activacion.codigo-expiracion-minutos=30
